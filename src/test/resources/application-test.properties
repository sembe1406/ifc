# Configuration de test pour l'application IFC
# Base de données de test (H2 en mémoire)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate pour les tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port pour les tests
server.port=0

# Désactiver les endpoints actuator non nécessaires pour les tests
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Configuration de logging pour les tests
logging.level.com.afc.ifc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Désactiver la console H2 pour les tests
spring.h2.console.enabled=false
